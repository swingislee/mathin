services:
  formula-ocr:
    container_name: mathin-formula-ocr
    image: mathin-formula-ocr:1.1.6-r1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIX2TEXT_VERSION: "1.1.6"
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    working_dir: /tmp
    user: "${MATHIN_FORMULA_OCR_UID:-1000}:${MATHIN_FORMULA_OCR_GID:-1000}"
    environment:
      HOME: /tmp
      HF_HOME: /models/huggingface
      XDG_CACHE_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "127.0.0.1,localhost"
    volumes:
      - "${MATHIN_FORMULA_OCR_MODEL_ROOT:-/home/swing/services/mathin-formula-ocr/models}:/models"
    tmpfs:
      - /tmp:size=256m,mode=1777
    command:
      - -l
      - en,ch_sim
      - --disable-table
      - -d
      - cpu
      - -H
      - 127.0.0.1
      - -p
      - "8503"
    cpus: "3.0"
    mem_limit: 3g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8503/docs', timeout=5).read(1)"
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 15m
