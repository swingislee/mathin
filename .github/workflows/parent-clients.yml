name: Requested parent client builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '要交付的客户端'
        required: true
        default: ios
        type: choice
        options: [ios, android]

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mathin-parent-android-debug
          path: apps/parent-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build iOS simulator
        run: >-
          xcodebuild -project apps/parent-ios/MathinParent.xcodeproj
          -scheme MathinParent -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/parent-ios/build
          CODE_SIGNING_ALLOWED=NO build
