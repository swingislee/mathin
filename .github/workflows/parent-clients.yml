name: Parent clients

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'contracts/parent-api/**'
      - 'scripts/check-parent-foundation.mjs'
      - 'scripts/parent-toolchains.mjs'
      - 'tests/parent-foundation.test.ts'
      - 'src/app/api/health/route.ts'
      - 'src/app/globals.css'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.github/workflows/parent-clients.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'contracts/parent-api/**'
      - 'scripts/check-parent-foundation.mjs'
      - 'scripts/parent-toolchains.mjs'
      - 'tests/parent-foundation.test.ts'
      - 'src/app/api/health/route.ts'
      - 'src/app/globals.css'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.github/workflows/parent-clients.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parent-clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm parents:check

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mathin-parent-android-debug
          path: apps/parent-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: plutil -lint apps/parent-ios/MathinParent.xcodeproj/project.pbxproj apps/parent-ios/MathinParent/Info.plist
      - name: Build iOS simulator
        run: >-
          xcodebuild -project apps/parent-ios/MathinParent.xcodeproj
          -scheme MathinParent -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/parent-ios/build
          CODE_SIGNING_ALLOWED=NO build
